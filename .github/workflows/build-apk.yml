name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Build and capture log
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p ci
          {
            echo "=== java ==="
            java -version
            echo "=== gradle ==="
            gradle --version
            echo "=== android sdk ==="
            sdkmanager --list_installed
            echo "=== build ==="
            gradle --no-daemon :app:assembleDebug --stacktrace
          } > ci/latest-build.log 2>&1
          code=$?
          echo "BUILD_EXIT_CODE=$code" >> ci/latest-build.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit diagnostic log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/latest-build.log
          git commit -m "CI build log [skip ci]" || true
          git push

      - name: Prepare APK
        if: steps.build.outputs.code == '0'
        run: cp app/build/outputs/apk/debug/app-debug.apk adaptive-keyboard-debug.apk

      - name: Upload APK
        if: steps.build.outputs.code == '0'
        uses: actions/upload-artifact@v7
        with:
          name: adaptive-keyboard-debug
          path: adaptive-keyboard-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail if build failed
        if: steps.build.outputs.code != '0'
        run: exit 1
