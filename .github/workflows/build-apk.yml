name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: JayKoo/adaptive-keyboard
    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" src
          cd src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build APK
        id: build
        shell: bash
        run: |
          cd src
          mkdir -p ci
          set +e
          {
            echo "=== date ==="
            date -u
            echo "=== java ==="
            java -version
            echo "=== gradle ==="
            gradle --version
            echo "=== build ==="
            gradle --no-daemon :app:assembleDebug --stacktrace
          } > ci/latest-build.log 2>&1
          code=$?
          echo "BUILD_EXIT_CODE=$code" >> ci/latest-build.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk adaptive-keyboard-debug.apk
          fi
          exit 0

      - name: Publish APK release
        id: release
        if: steps.build.outputs.code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src
          set +e
          tag="debug-latest"
          gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$tag" adaptive-keyboard-debug.apk             --title "Adaptive Keyboard Debug APK"             --notes "Automatically built debug APK from main."
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist CI status
        if: always()
        shell: bash
        run: |
          cd src
          build_code="${{ steps.build.outputs.code }}"
          release_code="${{ steps.release.outputs.code }}"
          [ -z "$build_code" ] && build_code=99
          [ -z "$release_code" ] && release_code=99

          {
            echo "BUILD=$build_code"
            echo "RELEASE=$release_code"
            if [ "$build_code" = "0" ] && [ "$release_code" = "0" ]; then
              echo "FINAL=SUCCESS"
            else
              echo "FINAL=FAILURE"
            fi
          } > ci/status.txt

          git add ci/latest-build.log ci/status.txt
          git commit -m "CI result [skip ci]" || true
          git push origin main

      - name: Verify success
        if: always()
        shell: bash
        run: |
          cd src
          grep -q '^FINAL=SUCCESS$' ci/status.txt
