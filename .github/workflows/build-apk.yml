name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: JayKoo/adaptive-keyboard
    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" src
          cd src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and persist diagnostics
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src
          mkdir -p ci
          set +e
          {
            echo "=== date ==="
            date -u
            echo "=== java ==="
            java -version
            echo "=== environment ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "=== sdkmanager ==="
            command -v sdkmanager || true
            sdkmanager --version || true
            echo "=== install sdk ==="
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
            echo "=== gradle ==="
            if command -v gradle >/dev/null 2>&1; then
              gradle --version
            else
              curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /tmp
              export PATH="/tmp/gradle-8.9/bin:$PATH"
              gradle --version
            fi
            echo "=== android build ==="
            gradle --no-daemon :app:assembleDebug --stacktrace
          } > ci/latest-build.log 2>&1
          code=$?
          echo "BUILD_EXIT_CODE=$code" >> ci/latest-build.log
          echo "code=$code" >> "$GITHUB_OUTPUT"

          git add ci/latest-build.log
          git commit -m "CI diagnostic log [skip ci]" || true
          git push origin main

          if [ "$code" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk adaptive-keyboard-debug.apk
          fi
          exit 0

      - name: Publish APK to release
        if: steps.build.outputs.code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src
          tag="debug-latest"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" adaptive-keyboard-debug.apk --title "Adaptive Keyboard Debug APK" --notes "Automatically built debug APK."

      - name: Fail if build failed
        if: steps.build.outputs.code != '0'
        run: exit 1
